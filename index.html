<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Versione PNG -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Per compatibilità Apple -->
  <link rel="apple-touch-icon" href="favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gojo Is Alive</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      color: cyan;
      font-family: monospace;
      white-space: pre; /* mantiene spazi e va a capo solo dove c'è \n */
      overflow: scroll; /* abilita scorrimento in entrambe le direzioni */
    }

    #content {
      font-size: 20px;
      line-height: 24px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div id="content"></div>

  <script>
    const content = document.getElementById("content");
    const text = "🔵 Gojo is alive 🔴 ";
    const lineHeight = 24; // deve corrispondere al CSS
    const charWidth = 12;  // larghezza media di un carattere monospace

    let renderedRows = 0;
    let renderedCols = 0;

    function fillScreen() {
      const visibleWidth = window.innerWidth + window.scrollX;
      const visibleHeight = window.innerHeight + window.scrollY;

      const totalCols = Math.ceil(visibleWidth / charWidth);
      const totalRows = Math.ceil(visibleHeight / lineHeight);

      // Se serve più righe
      while (renderedRows < totalRows) {
        // Nessun taglio: ripete indefinitamente la frase
        let line = "";
        while (line.length < totalCols * 2) { // un po' extra per lo scroll orizzontale
          line += text;
        }
        content.innerHTML += line + "\n";
        renderedRows++;
      }

      // Se serve più colonne, aggiorna ogni riga
      if (renderedCols < totalCols) {
        const lines = content.innerHTML.split("\n");
        for (let i = 0; i < lines.length - 1; i++) {
          while (lines[i].length < totalCols * 2) {
            lines[i] += text;
          }
        }
        content.innerHTML = lines.join("\n");
        renderedCols = totalCols;
      }
    }

    fillScreen();

    window.addEventListener("scroll", fillScreen);
    window.addEventListener("resize", () => {
      renderedRows = 0;
      renderedCols = 0;
      content.innerHTML = "";
      fillScreen();
    });
  </script>
</body>
</html>
